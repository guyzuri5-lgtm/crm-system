# הפעלה ידנית של הקרון של ה-CRM.
#
# ── התזמון ירד מכאן ב-25.9.2026 ──
# הקובץ הזה תיזמן את הקרון כל 15 דקות מ-1.9.2026, והזהיר מהיום הראשון
# ש"התזמון של GitHub הוא מאמץ סביר ולא הבטחה". ב-23.9 בערב האזהרה התממשה:
#
#     23.9 ..... 58 ריצות מתוך 96
#     24.9 ....... 6 ריצות מתוך 96
#     25.9 ....... 2 ריצות עד הצהריים
#
# כל ריצה שכן יצאה לדרך הצליחה תוך 10 שניות — הבעיה מעולם לא הייתה כאן,
# ולכן גם לא ניתן היה לתקן אותה כאן. המחיר נגבה מלקוחה ששילמה על קורס
# בבוקר ה-25.9 ולא קיבלה אותו, כי צירוף למסע קרה רק בריצת קרון.
#
# ── מי מתזמן עכשיו ──
# pg_cron, בתוך Supabase. ר' supabase/migrations/0043_pg_cron_schedule.sql.
# הוא רץ כל 15 דקות בתוך המסד, מתוזמן בידי פוסטגרס ולא בידי תור CI משותף.
# אומת בפרודקשן ב-25.9.2026 בשעה 12:15 UTC: הריצה יצאה בשנייה הנכונה,
# הסתיימה תוך 2.2 שניות, וצירפה ושלחה את מה שהמתין.
#
# ── למה הקובץ נשאר ──
# workflow_dispatch: הרצה ידנית מלשונית Actions, כשצריך לדחוף ריצה עכשיו
# בלי לחכות לרבע השעה הבא. זה הכלי שבו אפשר לשחרר לקוח תקוע בלחיצה אחת.
#
# **לא להחזיר את schedule לכאן בלי להסיר את המשימה מ-pg_cron.** שני מתזמנים
# על אותו endpoint יכולים לרוץ בו-זמנית, ושתי ריצות במקביל יכולות שתיהן
# לשלוח לפני שאחת מהן הספיקה לרשום — כלומר הודעה כפולה ללקוח.

name: CRM cron

on:
  # ידנית בלבד. התזמון עבר ל-pg_cron — ר' ההסבר בראש הקובץ.
  workflow_dispatch:

# ריצה שנתקעה לא תצטבר עם הבאות. השליחה עצמה בטוחה לחזרות, אבל שתי ריצות
# במקביל יכולות שתיהן לשלוח לפני שאחת מהן הספיקה לרשום — וזו שליחה כפולה.
#
# נשאר גם אחרי שהתזמון ירד: שתי לחיצות ידניות ברצף הן בדיוק התרחיש הזה.
concurrency:
  group: crm-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: הפעלת הקרון
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # אם הדומיין של הפרודקשן משתנה — כאן משנים אותו.
          CRM_URL: https://crm-system-eight-omega.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET לא מוגדר ב-Secrets של הריפו"
            exit 1
          fi

          # ‎--fail-with-body מחזיר קוד יציאה שגוי על 4xx/5xx *ומדפיס* את הגוף,
          # כך שהשגיאה של השרת נראית בלוג ולא רק "exit 22".
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRM_URL/api/cron/check-rules"
